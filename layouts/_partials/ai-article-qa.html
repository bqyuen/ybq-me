{{- /* AI 文章问答区 — 每篇文章底部的专属 AI 问答 */ -}}
{{- if and (not (eq .Layout "search")) (not (eq .Type "models")) -}}
<section class="ai-qa-section" id="ai-qa-section">
  <div class="ai-qa-header">
    <span class="ai-qa-icon">✦</span>
    <h3 class="ai-qa-title">关于这篇文章，问我任何问题</h3>
    <p class="ai-qa-subtitle">AI 守护者基于当前文章内容为你解答</p>
  </div>

  <div class="ai-qa-suggestions" id="ai-qa-suggestions">
    <button class="ai-qa-chip" data-q="这篇文章的核心观点是什么？">核心观点</button>
    <button class="ai-qa-chip" data-q="能举一个实际应用的例子吗？">实际例子</button>
    <button class="ai-qa-chip" data-q="有哪些相关的思维模型？">相关模型</button>
    <button class="ai-qa-chip" data-q="这个概念的局限性是什么？">局限性</button>
  </div>

  <div class="ai-qa-messages" id="ai-qa-messages"></div>

  <form class="ai-qa-input-row" id="ai-qa-form" autocomplete="off">
    <input type="text" class="ai-qa-input" id="ai-qa-input" placeholder="输入你的问题…" maxlength="500">
    <button type="submit" class="ai-qa-send" aria-label="发送">→</button>
  </form>

  <div class="ai-qa-footnote">AI 可能出错，重要信息请查阅原文</div>
</section>

<style>
.ai-qa-section {
  margin: 3rem auto 0;
  max-width: 720px;
  padding: 2rem;
  background: var(--entry, #f8f8f8);
  border-radius: 16px;
  border: 1px solid var(--border, #e5e5e5);
}

.ai-qa-header { text-align: center; margin-bottom: 1.5rem; }
.ai-qa-icon { font-size: 28px; display: block; margin-bottom: 8px; }
.ai-qa-title { font-size: 1.1rem; font-weight: 700; color: var(--content, #333); margin: 0; }
.ai-qa-subtitle { font-size: 0.85rem; color: var(--secondary, #999); margin-top: 4px; }

.ai-qa-suggestions {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-bottom: 1.5rem;
}
.ai-qa-chip {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border, #ddd);
  background: var(--theme, #fff);
  color: var(--content, #333);
  font-size: 13px; cursor: pointer;
  transition: all .2s;
}
.ai-qa-chip:hover {
  border-color: #C89F65; color: #C89F65;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(200,159,101,.2);
}

.ai-qa-messages {
  min-height: 60px; max-height: 400px; overflow-y: auto;
  margin-bottom: 1rem;
}
.ai-qa-msg {
  padding: 12px 16px; border-radius: 12px;
  margin-bottom: 10px; font-size: 14px; line-height: 1.7;
  animation: qaMsgIn .3s ease-out;
}
@keyframes qaMsgIn { from { opacity: 0; transform: translateY(8px); } }
.ai-qa-msg.user {
  background: rgba(200,159,101,.15); color: var(--content, #333);
  margin-left: 20%; text-align: right;
  border-bottom-right-radius: 4px;
}
.ai-qa-msg.ai {
  background: var(--theme, #fff); color: var(--content, #333);
  margin-right: 10%; border: 1px solid var(--border, #eee);
  border-bottom-left-radius: 4px;
}
.ai-qa-msg.ai strong { color: #C89F65; }
.ai-qa-msg.typing { color: var(--secondary, #999); font-style: italic; }

.ai-qa-input-row { display: flex; gap: 8px; }
.ai-qa-input {
  flex: 1; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--border, #ddd);
  background: var(--theme, #fff); color: var(--content, #333);
  font-size: 14px; outline: none;
  transition: border-color .2s;
}
.ai-qa-input:focus { border-color: #C89F65; }
.ai-qa-input::placeholder { color: var(--secondary, #bbb); }
.ai-qa-send {
  width: 42px; height: 42px; border-radius: 10px;
  border: none; background: #C89F65; color: #fff;
  font-size: 18px; cursor: pointer;
  transition: all .2s;
}
.ai-qa-send:hover { background: #b88a4a; transform: translateY(-1px); }

.ai-qa-footnote {
  text-align: center; font-size: 11px;
  color: var(--secondary, #aaa); margin-top: 12px;
}

@media (max-width: 600px) {
  .ai-qa-section { padding: 1.2rem; margin: 2rem 0; }
  .ai-qa-msg.user { margin-left: 10%; }
  .ai-qa-msg.ai { margin-right: 0; }
}
</style>

<script>
(function() {
  var QA_ENDPOINT = 'https://ybq-me-ai.garyyuen.workers.dev';
  var section = document.getElementById('ai-qa-section');
  if (!section) return;

  var suggestionsEl = document.getElementById('ai-qa-suggestions');
  var messagesEl = document.getElementById('ai-qa-messages');
  var form = document.getElementById('ai-qa-form');
  var input = document.getElementById('ai-qa-input');
  var history = [];

  // 获取文章上下文
  function getArticleContext() {
    var title = document.title.replace(/\s*[|\-·].*$/, '').trim();
    var desc = '';
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) desc = metaDesc.getAttribute('content') || '';

    var content = '';
    var article = document.querySelector('.post-content') || document.querySelector('article');
    if (article) {
      var clone = article.cloneNode(true);
      clone.querySelectorAll('script,style,.ai-qa-section,.related-models,#ai-assistant').forEach(function(el){ el.remove(); });
      content = (clone.innerText || '').replace(/\s+/g, ' ').trim().substring(0, 3000);
    }

    return { title: title, summary: desc, content: content, url: window.location.pathname };
  }

  var pageContext = getArticleContext();

  // 添加消息
  function addMsg(role, text) {
    var div = document.createElement('div');
    div.className = 'ai-qa-msg ' + role;
    div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    if (role === 'user') history.push({ role: 'user', content: text });
    if (role === 'ai') history.push({ role: 'assistant', content: text });
    if (history.length > 8) history = history.slice(-8);
  }

  // 发送问题
  async function ask(q) {
    if (!q) return;
    suggestionsEl.style.display = 'none';
    addMsg('user', q);
    input.value = '';

    var typing = document.createElement('div');
    typing.className = 'ai-qa-msg ai typing';
    typing.textContent = '思考中…';
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      var resp = await fetch(QA_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'ask',
          question: q,
          history: history.slice(-6),
          pageContext: pageContext
        })
      });
      var data = await resp.json();
      typing.remove();
      if (data.answer) {
        addMsg('ai', data.answer);
      } else {
        addMsg('ai', '暂时无法回答，请稍后再试。');
      }

      // 追踪交互
      try {
        fetch(QA_ENDPOINT + '/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'qa',
            question: q.substring(0, 100),
            answer: data.answer ? data.answer.substring(0, 200) : '',
            page: window.location.pathname
          })
        });
      } catch(e) {}

    } catch (e) {
      typing.remove();
      addMsg('ai', '网络错误，请稍后重试。');
    }
  }

  // 事件绑定
  form.addEventListener('submit', function(e) { e.preventDefault(); ask(input.value.trim()); });
  suggestionsEl.querySelectorAll('.ai-qa-chip').forEach(function(btn) {
    btn.addEventListener('click', function() { ask(btn.dataset.q); });
  });
})();
</script>
{{- end -}}
