{{- /* AI 全站粒子系统 — 鼠标尾迹 + 环境漂浮粒子 */ -}}
{{- if not (eq .Layout "search") -}}
<canvas id="ai-particles-canvas"></canvas>

<style>
#ai-particles-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 9990;
  opacity: 0.7;
}
@media (prefers-reduced-motion: reduce) {
  #ai-particles-canvas { display: none; }
}
</style>

<script>
(function() {
  var canvas = document.getElementById('ai-particles-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H;
  var mouse = { x: -100, y: -100 };
  var particles = [];
  var trailParticles = [];
  var ambientParticles = [];
  var AMBIENT_COUNT = 25;
  var TRAIL_RATE = 3;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // 鼠标跟踪
  document.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    // 生成尾迹粒子
    for (var i = 0; i < TRAIL_RATE; i++) {
      trailParticles.push({
        x: mouse.x + (Math.random() - 0.5) * 8,
        y: mouse.y + (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5 - 0.5,
        life: 1,
        decay: 0.015 + Math.random() * 0.015,
        size: 2 + Math.random() * 3,
        hue: 35 + Math.random() * 15
      });
    }
  });

  // 环境漂浮粒子
  for (var i = 0; i < AMBIENT_COUNT; i++) {
    ambientParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.1 - Math.random() * 0.3,
      size: 1 + Math.random() * 2,
      alpha: 0.1 + Math.random() * 0.3,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.01 + Math.random() * 0.02,
      hue: 35 + Math.random() * 15
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 绘制环境粒子
    ambientParticles.forEach(function(p) {
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += p.pulseSpeed;

      // 边界循环
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;

      var a = p.alpha * (0.5 + 0.5 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 70%, 65%, ' + a + ')';
      ctx.fill();
    });

    // 绘制鼠标尾迹粒子
    for (var i = trailParticles.length - 1; i >= 0; i--) {
      var p = trailParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy -= 0.02; // 轻微上浮
      p.life -= p.decay;

      if (p.life <= 0) {
        trailParticles.splice(i, 1);
        continue;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 80%, 65%, ' + (p.life * 0.8) + ')';
      ctx.fill();
    }

    // 限制粒子数量
    if (trailParticles.length > 150) trailParticles.splice(0, 30);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
{{- end -}}
