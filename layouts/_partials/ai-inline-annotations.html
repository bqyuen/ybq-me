  // 只在文章页面运行
  var article = document.querySelector('.post-content');
  if (!article) return;

  // 避免在特定区域运行
  var skipTags = ['SCRIPT', 'STYLE', 'CODE', 'PRE', 'A', 'BUTTON', 'INPUT', 'TEXTAREA'];

  // 扫描文本节点并添加注解
  var terms = Object.keys(GLOSSARY).sort(function(a, b) { return b.length - a.length; });
  var termRegex = new RegExp('(' + terms.map(function(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'g');

  function scanNode(node) {
    if (node.nodeType !== 3) return; // 只处理文本节点
    if (skipTags.indexOf(node.parentNode.tagName) !== -1) return;
    if (node.parentNode.closest('.ai-annotation')) return;
    if (node.parentNode.closest('.ai-qa-section')) return;

    var text = node.textContent;
    if (!termRegex.test(text)) return;
    termRegex.lastIndex = 0;

    var fragment = document.createDocumentFragment();
    var lastIndex = 0;
    var match;

    while ((match = termRegex.exec(text)) !== null) {
      // 匹配前的文本
      if (match.index > lastIndex) {
        fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      }

      // 创建注解标记
      var span = document.createElement('span');
      span.className = 'ai-annotation';
      span.dataset.term = match[0];
      span.dataset.explain = GLOSSARY[match[0]] || '';
      span.textContent = match[0];
      fragment.appendChild(span);

      lastIndex = match.index + match[0].length;
    }

    // 剩余文本
    if (lastIndex < text.length) {
      fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    node.parentNode.replaceChild(fragment, node);
  }

  // 遍历文章内容
  var walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, null, false);
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(scanNode);

  // 添加 tooltip 样式和行为
  var style = document.createElement('style');
  style.textContent = '.ai-annotation{border-bottom:1.5px dashed rgba(200,159,101,.4);cursor:help;position:relative;transition:border-color .2s}.ai-annotation:hover{border-color:#C89F65}.ai-annotation-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(15,20,30,.95);color:#f0e6d0;padding:8px 14px;border-radius:10px;font-size:12px;line-height:1.5;white-space:nowrap;opacity:0;pointer-events:none;transition:all .2s ease;z-index:100;backdrop-filter:blur(10px);border:1px solid rgba(200,159,101,.2);box-shadow:0 4px 16px rgba(0,0,0,.3)}.ai-annotation:hover .ai-annotation-tip{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:600px){.ai-annotation-tip{white-space:normal;max-width:200px}}';
  document.head.appendChild(style);

  // 为每个注解添加 tooltip
  document.querySelectorAll('.ai-annotation').forEach(function(el) {
    var tip = document.createElement('span');
    tip.className = 'ai-annotation-tip';
    tip.textContent = el.dataset.explain;
    el.appendChild(tip);
  });

</script>
