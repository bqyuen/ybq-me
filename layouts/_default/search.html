{{ define "main" }}
<article class="post-entry">
  <header class="entry-header">
    <h1 class="entry-hint-parent">🔍 智能搜索</h1>
  </header>
  <div class="post-content">
    <div class="ai-search-container">
      <div class="ai-search-box">
        <input type="text" id="ai-search-input" class="ai-search-input" placeholder="用自然语言描述你想找的…" autocomplete="off">
        <button id="ai-search-btn" class="ai-search-btn" aria-label="搜索">→</button>
      </div>
      <div class="ai-search-hint">AI 会理解你的意图，从思维模型、文章、学习资料中找到最相关的内容</div>

      <div id="ai-search-results" class="ai-search-results"></div>

      <div class="ai-search-examples">
        <h3>试试这些</h3>
        <div class="ai-search-example-list">
          <button class="ai-search-example" data-q="我该怎么做一个很难的决定">我该怎么做一个很难的决定</button>
          <button class="ai-search-example" data-q="如何培养长期思维">如何培养长期思维</button>
          <button class="ai-search-example" data-q="怎么避免被情绪左右判断">怎么避免被情绪左右判断</button>
          <button class="ai-search-example" data-q="想提升团队执行力有什么模型">想提升团队执行力有什么模型</button>
          <button class="ai-search-example" data-q="如何搭建本地AI知识库">如何搭建本地AI知识库</button>
          <button class="ai-search-example" data-q="多Agent协作怎么管理">多Agent协作怎么管理</button>
        </div>
      </div>
    </div>
  </div>
</article>

<style>
.ai-search-container { max-width: 700px; margin: 0 auto; }
.ai-search-box { display: flex; gap: 10px; margin-bottom: 12px; }
.ai-search-input {
  flex: 1; padding: 14px 18px; border-radius: 12px;
  border: 2px solid var(--border, #ddd);
  background: var(--theme, #fff); color: var(--content, #333);
  font-size: 16px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.ai-search-input:focus {
  border-color: #C89F65;
  box-shadow: 0 0 0 3px rgba(200,159,101,.15);
}
.ai-search-input::placeholder { color: var(--secondary, #bbb); }
.ai-search-btn {
  width: 50px; border-radius: 12px; border: none;
  background: #C89F65; color: #fff; font-size: 20px;
  cursor: pointer; transition: all .2s;
}
.ai-search-btn:hover { background: #b88a4a; transform: translateY(-1px); }

.ai-search-hint {
  font-size: 13px; color: var(--secondary, #999);
  margin-bottom: 2rem; text-align: center;
}

.ai-search-results { margin-bottom: 2rem; }
.ai-search-result {
  padding: 16px 20px; margin-bottom: 12px;
  background: var(--entry, #f8f8f8);
  border-radius: 12px; border: 1px solid var(--border, #eee);
  cursor: pointer; transition: all .2s; text-decoration: none; display: block;
  color: var(--content, #333);
}
.ai-search-result:hover {
  border-color: #C89F65;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(200,159,101,.15);
}
.ai-search-result-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ai-search-result-tag {
  display: inline-block; padding: 2px 8px; border-radius: 8px;
  font-size: 11px; font-weight: 600;
}
.ai-search-result-tag.model { background: rgba(200,159,101,.15); color: #C89F65; }
.ai-search-result-tag.article { background: rgba(52,100,122,.15); color: #34647a; }
.ai-search-result-tag.insight { background: rgba(62,142,126,.15); color: #3e8e7e; }
.ai-search-result-title {
  font-size: 16px; font-weight: 700;
  color: var(--content, #333);
}
.ai-search-result-desc {
  font-size: 13px; color: var(--secondary, #666);
  line-height: 1.6;
}

.ai-search-loading {
  text-align: center; padding: 2rem;
  color: var(--secondary, #999);
}

.ai-search-ask-more {
  text-align: center; padding: 1.5rem;
  background: var(--entry, #f8f8f8);
  border-radius: 12px; border: 1px solid var(--border, #eee);
  margin-top: 1rem;
}
.ai-search-ask-more p { margin: 0 0 1rem; color: var(--secondary, #999); font-size: 13px; }
.ai-search-ask-btn {
  padding: 10px 20px; border-radius: 10px; border: none;
  background: rgba(200,159,101,.15); color: #C89F65;
  font-size: 14px; cursor: pointer; transition: all .2s;
}
.ai-search-ask-btn:hover { background: rgba(200,159,101,.25); }

.ai-search-examples { margin-top: 2rem; }
.ai-search-examples h3 {
  font-size: 14px; color: var(--secondary, #999);
  margin-bottom: 12px; text-align: center;
}
.ai-search-example-list {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center;
}
.ai-search-example {
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid var(--border, #ddd);
  background: var(--theme, #fff);
  color: var(--content, #333); font-size: 13px;
  cursor: pointer; transition: all .2s;
}
.ai-search-example:hover {
  border-color: #C89F65; color: #C89F65;
  transform: translateY(-1px);
}
</style>

<script>
(function() {
  var SEARCH_API = 'https://ybq-me-ai.garyyuen.workers.dev';
  var input = document.getElementById('ai-search-input');
  var btn = document.getElementById('ai-search-btn');
  var results = document.getElementById('ai-search-results');
  var examples = document.querySelector('.ai-search-examples');

  var MODELS = [
    '001-机会成本','002-沉没成本','003-直觉','004-决策树','005-非sr思维','006-确认偏误',
    '007-易得性偏差','008-逆向思维','009-六顶思考帽','010-101010旁观','011-升维思维',
    '012-笛卡尔思维','013-第一性原理','014-奥卡姆剃刀','015-马斯洛需求层次理论',
    '016-反脆弱','017-万物联系','018-万物系统','019-大脑系统','020-卡尼曼双系统',
    '021-冯诺依曼','022-三层解释','023-损失规避','024-替身决策','025-多维视角',
    '026-局部全局最优','027-不平衡性','028-破界思维','029-非线性思维','030-自我催化',
    '031-优先排序','032-黄金圈思维','033-心流理论','034-长线思考','035-隐含前提',
    '036-时光机理论','037-升维打击','038-凸透放大镜思维','039-凹透缩小镜思维','040-九宫格',
    '041-反作用力','042-思维投影','043-蝴蝶效应','044-成长破圈','045-上帝视角',
    '046-演绎法','047-可复制化','048-幸存者偏差','049-冰山理论','050-邓克效应',
    '051-效率思维','052-福格行为','053-反熵增','054-混沌与秩序','055-费马帕斯卡',
    '056-费曼技巧','057-复利效应','058-二八定律','059-决策损失','060-启发式偏差',
    '061-批判性思维','062-金字塔原理','063-mece原则','064-耗散结构理论','065-冗余备份',
    '066-路径依赖','067-元认知','068-排列组合','069-人类误判心理','070-遗忘曲线',
    '071-断裂点理论','072-杠杆原理','073-长尾理论','074-沉默的螺旋','075-飞轮效应',
    '076-swot分析','077-pdca循环','078-周哈里窗','079-煤气灯效应','080-系列位置效应',
    '081-推论阶梯','082-反事实思维','083-长短板理论','084-鸟笼效应','085-峰终定律',
    '086-5w1h分析法','087-归因效应','088-hook上瘾模型','089-情境领导理论','090-博弈论',
    '091-动态思维','092-溯因推理','093-情绪abc理论','094-蘑菇管理','095-前景理论',
    '096-双目标清单','097-梅特卡夫法则','098-正确与非共识','099-波特五力分析','100-护城河理论'
  ];

  // 文章列表
  var ARTICLES = [
    { slug: '/ai-learning/local-ai-knowledgebase/', title: '从零搭建我的本地 AI 知识库', type: 'article' },
    { slug: '/ai-learning/multi-agent-governance/', title: '多 Agent 协同治理', type: 'article' },
    { slug: '/ai-learning/deliberate-practice/', title: '刻意练习', type: 'article' },
    { slug: '/ai-learning/half-year-expert/', title: '半年成为专家', type: 'article' },
    { slug: '/insights/global-debt-ledger/', title: '全球债务348万亿', type: 'insight' },
    { slug: '/insights/stablecoin-dollar-hegemony/', title: '稳定币与美元霸权', type: 'insight' }
  ];

  // 模糊匹配模型名
  function findModel(query) {
    query = query.replace(/^[0-9]+[-.、]\s*/, '').trim();
    for (var i = 0; i < MODELS.length; i++) {
      var parts = MODELS[i].split('-');
      var name = parts.slice(1).join('-');
      if (name === query || name.indexOf(query) !== -1 || query.indexOf(name) !== -1) return MODELS[i];
    }
    var cleanQuery = query.replace(/理论|法则|效应|原理|思维|定律|原则|模型|方法|分析|框架/g, '');
    for (var j = 0; j < MODELS.length; j++) {
      var p = MODELS[j].split('-');
      var n = p.slice(1).join('-').replace(/理论|法则|效应|原理|思维|定律|原则|模型|方法|分析|框架/g, '');
      if (n === cleanQuery || n.indexOf(cleanQuery) !== -1 || cleanQuery.indexOf(n) !== -1) return MODELS[j];
    }
    return null;
  }

  async function search(q) {
    if (!q) return;
    results.innerHTML = '<div class="ai-search-loading">✦ AI 正在理解你的问题…</div>';
    examples.style.display = 'none';

    var modelList = MODELS.join('、');
    var articleList = ARTICLES.map(function(a) { return a.title; }).join('、');

    var prompt = '用户搜索："' + q + '"\n\n网站包含以下内容：\n\n【100个思维模型】' + modelList + '\n\n【文章】' + articleList + '\n\n请根据用户的搜索意图，推荐最相关的3-5个内容。每个用以下格式：\n类型|编号或标题|一句话推荐理由\n\n类型只能是：model 或 article\n如果是模型，编号必须使用上面列表中的精确名称（如004-决策树）\n如果是文章，使用上面的精确标题\n\n例如：\nmodel|004-决策树|帮助你把复杂决策拆解成可见的选项\narticle|从零搭建我的本地 AI 知识库|如果你想用AI管理知识，这篇是实战指南';

    try {
      var resp = await fetch(SEARCH_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'ask',
          question: prompt,
          history: [],
          pageContext: { title: '智能搜索', summary: '语义搜索', url: '/search/' }
        })
      });
      var data = await resp.json();
      results.innerHTML = '';

      if (data.answer) {
        var lines = data.answer.split('\n').filter(function(l) { return l.trim(); });
        var found = 0;

        lines.forEach(function(line) {
          var match = line.match(/^(model|article)\|(.+?)\|(.+)/);
          if (!match) return;

          var type = match[1];
          var id = match[2].trim();
          var reason = match[3].trim();
          var url = '';
          var title = '';

          if (type === 'model') {
            // 模糊匹配模型
            var slug = findModel(id);
            if (!slug) return;
            var parts = slug.split('-');
            url = '/models/' + encodeURIComponent(slug) + '/';
            title = '#' + parts[0] + ' ' + parts.slice(1).join('-');
          } else {
            // 查找文章
            var article = ARTICLES.find(function(a) { return a.title === id; });
            if (!article) return;
            url = article.slug;
            title = article.title;
            type = article.type || 'article';
          }

          found++;
          var tagClass = type === 'model' ? 'model' : (type === 'insight' ? 'insight' : 'article');
          var tagText = type === 'model' ? '思维模型' : (type === 'insight' ? '决策洞察' : 'AI 学习');

          results.innerHTML += '<a class="ai-search-result" href="' + url + '">' +
            '<div class="ai-search-result-header">' +
            '<span class="ai-search-result-tag ' + tagClass + '">' + tagText + '</span></div>' +
            '<div class="ai-search-result-title">' + title + '</div>' +
            '<div class="ai-search-result-desc">' + reason + '</div></a>';
        });

        // 添加"没找到？问AI"按钮
        results.innerHTML += '<div class="ai-search-ask-more">' +
          '<p>没找到想要的？直接问 AI 守护者</p>' +
          '<button class="ai-search-ask-btn" onclick="document.getElementById(\'ai-assistant-fab\').click()">✦ 问 AI</button></div>';
      }
    } catch (e) {
      results.innerHTML = '<div class="ai-search-loading" style="color:#c44">搜索失败，请稍后重试</div>';
    }
  }

  btn.addEventListener('click', function() { search(input.value.trim()); });
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') search(input.value.trim()); });

  document.querySelectorAll('.ai-search-example').forEach(function(b) {
    b.addEventListener('click', function() {
      input.value = b.dataset.q;
      search(b.dataset.q);
    });
  });
})();
</script>
{{ end }}
