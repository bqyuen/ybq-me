name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            public
          key: ${{ runner.os }}-hugocache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-hugocache-

      - name: Build
        run: hugo --minify --gc --cleanDestinationDir

      - name: Deploy to Cloudflare Pages
        # cloudflare/pages-action@v1 已下线（无法 resolve），改用官方替代 wrangler-action@v3
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e05beded5b02f2e211033aa57096a5fd
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name=ybq-me --branch=main